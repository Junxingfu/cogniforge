server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: always
spring:
  datasource:
    url: jdbc:h2:file:./data/cogniforge;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
